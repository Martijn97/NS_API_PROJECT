[project]
name = "ns-api-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Martijn Noordhof", email = "martijn.noordhof@firan.nl" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.2",
    "httpx>=0.28.1",
]

[project.scripts]
ns-api-project = "ns_api_project:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
    "ruff>=0.16.1",
]
