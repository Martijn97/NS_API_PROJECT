[project]
name = "ns-api-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Martijn Noordhof", email = "martijn.noordhof@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "httpx>=0.28.1",
]

[project.scripts]
ns-api-project = "ns_api_project.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits the live NS API, requires NS_API_KEY",
]
addopts = "--cov=src/ns_api_project --cov-report=term-missing -m 'not integration'"